services:
  postgres:
    image: postgres:16-alpine
    container_name: educare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: educare
      POSTGRES_USER: educare
      POSTGRES_PASSWORD: educare_dev_password
    ports:
      - "5432:5432"
    volumes:
      - educare-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educare -d educare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  educare-postgres-data:
